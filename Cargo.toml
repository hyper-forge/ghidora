[package]
name = "ghidora"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
boltffi = "0.32.1"
blake3 = { version = "1.5", default-features = false }
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
subtle = "2.6.1"
